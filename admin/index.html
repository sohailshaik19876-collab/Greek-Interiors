<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Enquiries — Greek Interiors</title>
<meta name="theme-color" content="#14110F">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="gi-mark" viewBox="0 0 120 120">
    <g fill="none" stroke="currentColor" stroke-width="4.4" stroke-linecap="square">
      <path d="M14 116V49.5C14 25.6 34.6 6 60 6s46 19.6 46 43.5"/>
      <path d="M14 116h92V72H70"/>
      <g stroke-width="2.2" opacity=".85"><path d="M27 104V52.5"/><path d="M36 104V47"/><path d="M45 104V43.5"/></g>
      <path d="M63 20v22" stroke-width="2.2"/>
      <path d="M52.5 55.5c0-5.8 4.7-10.5 10.5-10.5s10.5 4.7 10.5 10.5z" fill="currentColor" stroke="none"/>
      <g stroke-width="2.4">
        <path d="M56 104V92h30v12"/>
        <path d="M60 92V77c0-4.4 3.6-8 8-8h10c4.4 0 8 3.6 8 8v15"/>
        <path d="M62 104l-3 10M84 104l3 10"/>
      </g>
    </g>
  </symbol>
</svg>

<!-- ============ SIGN IN ============ -->
<section class="gate" id="gate" hidden>
  <form class="gate__card" id="loginForm" autocomplete="on">
    <span class="gate__mark"><svg viewBox="0 0 120 120" aria-hidden="true"><use href="#gi-mark"></use></svg></span>
    <h1 class="gate__title">Greek Interiors</h1>
    <p class="gate__sub">Enquiry dashboard</p>

    <label class="field">
      <span class="field__label">Password</span>
      <input type="password" id="password" name="password" autocomplete="current-password"
             required autofocus placeholder="••••••••">
    </label>

    <button class="btn btn--primary" type="submit" id="loginBtn">Sign in</button>
    <p class="gate__msg" id="loginMsg" role="status" aria-live="polite"></p>
  </form>
</section>

<!-- ============ DASHBOARD ============ -->
<div class="app" id="app" hidden>

  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__mark"><svg viewBox="0 0 120 120" aria-hidden="true"><use href="#gi-mark"></use></svg></span>
      <div>
        <span class="topbar__name">Greek Interiors</span>
        <span class="topbar__page">Enquiries</span>
      </div>
    </div>
    <div class="topbar__actions">
      <button class="btn btn--quiet" id="refreshBtn" type="button">Refresh</button>
      <button class="btn btn--quiet" id="exportBtn" type="button">Export CSV</button>
      <button class="btn btn--quiet" id="logoutBtn" type="button">Sign out</button>
    </div>
  </header>

  <main class="wrap">

    <p class="notice" id="notice" hidden></p>

    <!-- Hero figure + stat tiles -->
    <section class="summary" aria-label="Summary">
      <div class="hero-figure">
        <span class="hero-figure__label">Total enquiries</span>
        <span class="hero-figure__value" id="statTotal">—</span>
        <span class="hero-figure__delta" id="statDelta"></span>
      </div>

      <div class="tiles">
        <article class="tile">
          <span class="tile__label">Awaiting reply</span>
          <span class="tile__value" id="statNew">—</span>
        </article>
        <article class="tile">
          <span class="tile__label">Last 7 days</span>
          <span class="tile__value" id="statWeek">—</span>
        </article>
        <article class="tile">
          <span class="tile__label">In conversation</span>
          <span class="tile__value" id="statOpen">—</span>
        </article>
        <article class="tile">
          <span class="tile__label">Won</span>
          <span class="tile__value" id="statWon">—</span>
        </article>
      </div>
    </section>

    <!-- Weekly volume -->
    <section class="panel" aria-label="Enquiries per week">
      <header class="panel__head">
        <div>
          <h2 class="panel__title">Enquiries per week</h2>
          <p class="panel__sub">Last 12 weeks, Monday to Sunday</p>
        </div>
        <button class="btn btn--quiet btn--xs" id="chartTableBtn" type="button"
                aria-expanded="false" aria-controls="chartTable">Show data</button>
      </header>
      <div class="chart" id="chart"></div>
      <div class="chart-table" id="chartTable" hidden></div>
    </section>

    <!-- Filters + list -->
    <section class="panel" aria-label="All enquiries">
      <header class="panel__head panel__head--filters">
        <div class="filters">
          <label class="search">
            <span class="visually-hidden">Search enquiries</span>
            <input type="search" id="search" placeholder="Search name, phone, email or message">
          </label>
          <div class="chips" id="statusChips" role="group" aria-label="Filter by status"></div>
          <label class="select">
            <span class="visually-hidden">Filter by project type</span>
            <select id="typeFilter"><option value="">All project types</option></select>
          </label>
        </div>
        <p class="panel__count" id="resultCount"></p>
      </header>

      <div class="table-scroll">
        <table class="table">
          <thead>
            <tr>
              <th scope="col">Received</th>
              <th scope="col">Name</th>
              <th scope="col">Contact</th>
              <th scope="col">Project</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="empty" id="empty" hidden></p>
    </section>
  </main>
</div>

<!-- ============ DETAIL DRAWER ============ -->
<div class="drawer-scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Enquiry detail" aria-hidden="true" hidden>
  <header class="drawer__head">
    <div>
      <h2 class="drawer__name" id="dName"></h2>
      <p class="drawer__when" id="dWhen"></p>
    </div>
    <button class="icon-btn" id="closeDrawer" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </header>

  <div class="drawer__body">
    <div class="quick" id="dQuick"></div>

    <dl class="detail">
      <div><dt>Phone</dt><dd id="dPhone"></dd></div>
      <div><dt>Email</dt><dd id="dEmail"></dd></div>
      <div><dt>Project type</dt><dd id="dType"></dd></div>
      <div><dt>Source</dt><dd id="dSource"></dd></div>
    </dl>

    <div class="detail__block">
      <h3>Message</h3>
      <p class="detail__message" id="dMessage"></p>
    </div>

    <div class="detail__block">
      <label class="field">
        <span class="field__label">Status</span>
        <select id="dStatus"></select>
      </label>
    </div>

    <div class="detail__block">
      <label class="field">
        <span class="field__label">Internal notes</span>
        <textarea id="dNotes" rows="5" placeholder="Site visit booked for Saturday, budget discussed…"></textarea>
      </label>
    </div>
  </div>

  <footer class="drawer__foot">
    <button class="btn btn--primary" id="saveBtn" type="button">Save changes</button>
    <button class="btn btn--danger" id="deleteBtn" type="button">Delete</button>
    <p class="drawer__msg" id="drawerMsg" role="status" aria-live="polite"></p>
  </footer>
</aside>

<script src="/admin/admin.js" defer></script>
</body>
</html>
